<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>メンタリストDaiGo - おすすめ動画集</title>
  <style>
    :root {
      --player-width: 46%;
    }
    html, body {
      margin: 0; padding: 0; height: 100%; scroll-behavior: smooth;
      background: #f8f8f8; overflow: hidden;
    }
    body {
      font-family: Arial, sans-serif;
      display: flex;
      padding: 15px 15px 15px 0;
      gap: 15px;
    }

    /* サイドバー */
    #sidebar {
      width: 0; overflow: hidden; background: white; border-radius: 12px;
      box-shadow: 2px 0 10px rgba(0,0,0,0.1); transition: width 0.4s ease;
      height: 100vh; align-self: stretch; padding: 15px; z-index: 100;
      display: flex; flex-direction: column;
    }
    #sidebar.open { width: 380px; }
    .sidebar-section { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    #history, #later { flex: 1; overflow-y: auto; padding-right: 8px; margin-top: 8px; }

    #toggle-container {
      position: fixed; left: -2px; top: 20px; z-index: 99999;
      display: flex; flex-direction: column; gap: 14px;
    }
    #toggleHistoryBtn, #toggleLaterBtn {
      width: 56px; height: 56px; background: #0f0f0f; color: white;
      border: none; border-radius: 50%; font-size: 28px; cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.55); transition: all 0.3s;
    }
    #toggleHistoryBtn:hover, #toggleLaterBtn:hover {
      background: #000; transform: scale(1.18) translateX(2px);
    }

    #main { 
      flex: 1; 
      display: flex; 
      gap: 15px; 
      width: 100%; 
      height: 100%; 
      align-items: stretch;
    }

    #player-area {
      width: var(--player-width); 
      flex: 0 0 auto;
      min-width: 340px;
      background: white; 
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.2); 
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #player {
      flex: 1;                    /* これが重要！ */
      position: relative;
      min-height: 420px;
    }

    iframe { 
      width: 100%; 
      height: 100%; 
      border: none; 
      display: block;
    }

    #player-horizontal-handle { position: absolute; top: 0; right: -4px; width: 9px; height: 100%; background: transparent; cursor: col-resize; z-index: 220; }
    #vertical-resize-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 8px; background: #ddd; cursor: row-resize; z-index: 230; transition: background 0.2s; }
    #resize-bar { width: 6px; background: #ddd; cursor: col-resize; border-radius: 3px; margin: 0 -3px; z-index: 100; transition: background 0.2s; }
    #resize-bar:hover, #resize-bar.active,
    #vertical-resize-bar:hover, #vertical-resize-bar.active { background: #ff0000; }

    #thumbnail-area { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      min-height: 0;
    }

    h2 { margin: 0 0 12px 0; text-align: center; font-size: 26px; }

    #search-container { margin-bottom: 12px; }
    #searchInput {
      width: 100%; padding: 12px 16px; font-size: 16px;
      border: 2px solid #ddd; border-radius: 8px;
    }
    #searchInput:focus { border-color: #ff0000; outline: none; }

    #videos-wrapper { 
      flex: 1; 
      overflow-y: auto; 
      padding-right: 12px; 
    }
    #videos {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;
    }

    .video-item {
      background: white; border-radius: 12px; overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1); transition: transform 0.2s;
      position: relative; display: flex; flex-direction: column;
    }
    .thumbnail {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 */
    }
    .thumbnail img {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .play-btn {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 60px; height: 60px; background: rgba(0,0,0,0.78); color: white;
      border-radius: 50%; font-size: 32px; display: grid; place-items: center;
      z-index: 2;
    }
    .video-title {
      padding: 12px; font-size: 14.5px; line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 4;
      -webkit-box-orient: vertical; overflow: hidden;
      flex: 1;
    }
    .copy-btn, .later-btn {
      position: absolute; top: 10px; background: rgba(0,0,0,0.85);
      color: white; border: none; padding: 5px 10px;
      font-size: 11.5px; border-radius: 4px; cursor: pointer;
      opacity: 0; transition: all 0.25s;
    }
    .later-btn { right: 12px; }
    .copy-btn { right: 72px; }
    .video-item:hover .copy-btn,
    .video-item:hover .later-btn { opacity: 1; }
    .copy-btn:hover { background: #4caf50; }
    .later-btn:hover { background: #ff9800; }
    .active { outline: 4px solid #ff0000; outline-offset: -4px; }

    .fixed-buttons {
      position: fixed; right: 75px; bottom: 28px;
      display: flex; flex-direction: column; gap: 12px; z-index: 500;
    }
    .fixed-btn {
      padding: 13px 26px; border: none; border-radius: 999px;
      color: #fff; font-weight: bold; cursor: pointer;
      box-shadow: 0 6px 24px rgba(0,0,0,0.55);
    }
    #jumpBtn { background: #ff0000; }
    #topBtn { background: #333; }
  </style>
</head>
<body>
  <!-- ここからHTMLは前回と同じ -->
  <div id="toggle-container">
    <button id="toggleHistoryBtn">›</button>
    <button id="toggleLaterBtn">›</button>
  </div>

  <div id="sidebar">
    <div class="sidebar-section" id="historySection">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3>再生履歴</h3>
        <button id="clearHistoryBtn">全削除</button>
      </div>
      <div id="history"></div>
    </div>
    <hr style="border:none;border-top:3px solid #eee;margin:15px 0 25px 0;">
    <div class="sidebar-section" id="laterSection">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3>後で見る</h3>
        <button id="clearLaterBtn">全削除</button>
      </div>
      <div id="later"></div>
    </div>
  </div>

  <div id="main">
    <div id="player-area">
      <div id="player"></div>
      <div id="player-horizontal-handle"></div>
      <div id="vertical-resize-bar"></div>
    </div>
    <div id="resize-bar"></div>
    <div id="thumbnail-area">
      <h2>メンタリストDaiGo おすすめ動画集</h2>
      <div id="search-container">
        <input type="text" id="searchInput" placeholder="動画タイトルで検索...">
      </div>
      <div id="videos-wrapper">
        <div id="videos"></div>
        <div id="loading">DaiGoの動画を取得中...（先行35ページ）</div>
      </div>
    </div>
  </div>

  <div class="fixed-buttons">
    <button id="jumpBtn" class="fixed-btn">▶ 再生中へ戻る</button>
    <button id="topBtn" class="fixed-btn">↑ 一番上に戻る</button>
  </div>

<script>
  /* スクリプトは前回と同じ（変更なし） */
  const apiKey = "AIzaSyAxk1YpQSe-qDtFUSUmnjnduanag41Mlyk";
  const uploadsPlaylistId = "UUFdBehO71GQaIom4WfVeGSw";
  const historyKey = "daigo_history";
  const laterKey = "daigo_later";

  const sidebar = document.getElementById("sidebar");
  const toggleHistoryBtn = document.getElementById("toggleHistoryBtn");
  const toggleLaterBtn = document.getElementById("toggleLaterBtn");
  const historyBox = document.getElementById("history");
  const laterBox = document.getElementById("later");
  const player = document.getElementById("player");
  const videosContainer = document.getElementById("videos");
  const loadingEl = document.getElementById("loading");
  const searchInput = document.getElementById("searchInput");
  const jumpBtn = document.getElementById("jumpBtn");
  const topBtn = document.getElementById("topBtn");

  let currentActive = null;
  let allVideoElements = [];
  let isHistoryVisible = false;
  let isLaterVisible = false;

  function updateSidebar() {
    const open = isHistoryVisible || isLaterVisible;
    sidebar.classList.toggle("open", open);
    toggleHistoryBtn.textContent = isHistoryVisible ? "‹" : "›";
    toggleLaterBtn.textContent = isLaterVisible ? "‹" : "›";
    document.getElementById("historySection").style.display = isHistoryVisible ? "flex" : "none";
    document.getElementById("laterSection").style.display = isLaterVisible ? "flex" : "none";
  }

  function loadHistory() { return JSON.parse(localStorage.getItem(historyKey) || "[]"); }
  function loadLater() { return JSON.parse(localStorage.getItem(laterKey) || "[]"); }

  function saveHistory(video) {
    let h = loadHistory();
    h = h.filter(i => i.id !== video.id);
    h.unshift(video);
    localStorage.setItem(historyKey, JSON.stringify(h.slice(0, 30)));
    renderHistory();
  }

  function saveLater(video) {
    let l = loadLater();
    if (l.some(i => i.id === video.id)) return;
    l.unshift(video);
    localStorage.setItem(laterKey, JSON.stringify(l));
    renderLater();
  }

  function renderHistory() {
    const data = loadHistory();
    historyBox.innerHTML = data.length === 0 ? '<p style="color:#888;text-align:center;padding:40px 10px;">履歴はありません</p>' : "";
    data.forEach(item => {
      const div = document.createElement("div");
      div.className = "history-item";
      div.textContent = item.title;
      div.onclick = () => {
        const target = document.querySelector(`[data-id="${item.id}"]`);
        if (target) { target.scrollIntoView({behavior:"smooth", block:"center"}); setTimeout(() => target.click(), 300); }
      };
      historyBox.appendChild(div);
    });
  }

  function renderLater() {
    const data = loadLater();
    laterBox.innerHTML = data.length === 0 ? '<p style="color:#888;text-align:center;padding:40px 10px;">後で見るリストは空です</p>' : "";
    data.forEach(item => {
      const div = document.createElement("div");
      div.className = "later-item";
      div.innerHTML = `${item.title}<span style="float:right;color:#f44336;cursor:pointer;" onclick="event.stopImmediatePropagation();removeLater('${item.id}')">×</span>`;
      div.onclick = () => {
        const target = document.querySelector(`[data-id="${item.id}"]`);
        if (target) { target.scrollIntoView({behavior:"smooth", block:"center"}); setTimeout(() => target.click(), 300); }
      };
      laterBox.appendChild(div);
    });
  }

  function removeLater(id) {
    const filtered = loadLater().filter(i => i.id !== id);
    localStorage.setItem(laterKey, JSON.stringify(filtered));
    renderLater();
  }

  function playVideo(videoId, title, el) {
    player.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    if (currentActive) currentActive.classList.remove("active");
    el.classList.add("active");
    currentActive = el;
    saveHistory({id: videoId, title});
  }

  async function fetchDaiGoVideos() {
    let items = [];
    let pageToken = "";
    let pageCount = 0;
    const FIRST_LOAD = 35;
    const MAX_PAGES = 100;

    loadingEl.textContent = `先行取得中... (${FIRST_LOAD}ページ)`;

    while (pageToken !== null && pageCount < FIRST_LOAD) {
      try {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${uploadsPlaylistId}&key=${apiKey}&pageToken=${pageToken}`);
        if (!res.ok) break;
        const data = await res.json();
        if (data.items) items = items.concat(data.items);
        pageToken = data.nextPageToken;
        pageCount++;
        loadingEl.textContent = `先行表示中... ${items.length}本 (${pageCount}/${FIRST_LOAD})`;
        await new Promise(r => setTimeout(r, 160));
      } catch (e) { console.warn(e); break; }
    }

    renderAdditionalVideos(items, true);
    renderHistory();
    renderLater();
    updateSidebar();

    loadingEl.textContent = `先行${FIRST_LOAD}ページ完了！ 残りを取得中...`;

    while (pageToken !== null && pageCount < MAX_PAGES) {
      try {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${uploadsPlaylistId}&key=${apiKey}&pageToken=${pageToken}`);
        if (!res.ok) break;
        const data = await res.json();
        if (data.items?.length) {
          items = items.concat(data.items);
          renderAdditionalVideos(data.items, false);
        }
        pageToken = data.nextPageToken;
        pageCount++;
        if (pageCount % 10 === 0 || !pageToken) {
          loadingEl.textContent = `裏取得中... ${items.length}本 (${pageCount}/${MAX_PAGES})`;
        }
        await new Promise(r => setTimeout(r, 300));
      } catch (e) { console.warn(e); break; }
    }

    loadingEl.textContent = `全 ${items.length}本取得完了！`;
  }

  function renderAdditionalVideos(newItems, replace = false) {
    if (replace) {
      videosContainer.innerHTML = "";
      allVideoElements = [];
    }
    const fragment = document.createDocumentFragment();
    newItems.forEach(item => {
      const videoId = item.snippet.resourceId?.videoId;
      if (!videoId || document.querySelector(`[data-id="${videoId}"]`)) return;

      const rawTitle = item.snippet.title.toLowerCase();
      if (rawTitle.includes("short") || rawTitle.includes("ショート") || rawTitle.includes("1分") || rawTitle.includes("60秒")) return;

      const title = item.snippet.title;
      const thumbnail = item.snippet.thumbnails?.medium?.url || item.snippet.thumbnails?.default?.url || "";

      const div = document.createElement("div");
      div.className = "video-item";
      div.dataset.id = videoId;
      div.innerHTML = `
        <div class="thumbnail">
          <img src="${thumbnail}" loading="lazy" decoding="async" alt="${title}">
          <div class="play-btn">▶</div>
        </div>
        <div class="video-title">
          ${title}
          <button class="later-btn">後で見る</button>
          <button class="copy-btn">🔗</button>
        </div>
      `;

      div.onclick = (e) => {
        if (!e.target.classList.contains('copy-btn') && !e.target.classList.contains('later-btn')) {
          playVideo(videoId, title, div);
        }
      };
      div.querySelector('.copy-btn').onclick = (e) => { e.stopPropagation(); navigator.clipboard.writeText(`https://www.youtube.com/watch?v=${videoId}`); };
      div.querySelector('.later-btn').onclick = (e) => { e.stopPropagation(); saveLater({id: videoId, title}); };

      fragment.appendChild(div);
      allVideoElements.push(div);
    });
    videosContainer.appendChild(fragment);
  }

  function filterVideos() {
    const keyword = searchInput.value.toLowerCase().trim();
    allVideoElements.forEach(item => {
      const titleEl = item.querySelector(".video-title");
      if (titleEl) {
        const title = titleEl.textContent.toLowerCase();
        item.style.display = (!keyword || title.includes(keyword)) ? "" : "none";
      }
    });
  }

  async function main() {
    searchInput.addEventListener("input", filterVideos);
    await fetchDaiGoVideos();
  }

  toggleHistoryBtn.addEventListener("click", () => { isHistoryVisible = !isHistoryVisible; updateSidebar(); });
  toggleLaterBtn.addEventListener("click", () => { isLaterVisible = !isLaterVisible; updateSidebar(); });
  document.getElementById("clearHistoryBtn").addEventListener("click", () => {
    if(confirm("履歴をすべて削除しますか？")) { localStorage.removeItem(historyKey); renderHistory(); }
  });
  document.getElementById("clearLaterBtn").addEventListener("click", () => {
    if(confirm("後で見るリストをすべて削除しますか？")) { localStorage.removeItem(laterKey); renderLater(); }
  });
  jumpBtn.addEventListener("click", () => currentActive?.scrollIntoView({behavior:"smooth", block:"center"}));
  topBtn.addEventListener("click", () => document.getElementById("videos-wrapper").scrollTo({top:0, behavior:"smooth"}));

  let isResizingHorizontal = false, isResizingVertical = false;
  function initResize() {
    const resizeBar = document.getElementById("resize-bar");
    const playerHorizontalHandle = document.getElementById("player-horizontal-handle");
    const verticalResizeBar = document.getElementById("vertical-resize-bar");
    const playerArea = document.getElementById("player-area");

    const startHorizontal = (e) => {
      isResizingHorizontal = true;
      resizeBar.classList.add("active");
      playerHorizontalHandle.style.background = "rgba(255,0,0,0.3)";
      document.body.style.cursor = "col-resize";
      e.preventDefault();
    };

    resizeBar.addEventListener("mousedown", startHorizontal);
    playerHorizontalHandle.addEventListener("mousedown", startHorizontal);

    verticalResizeBar.addEventListener("mousedown", (e) => {
      isResizingVertical = true;
      verticalResizeBar.classList.add("active");
      document.body.style.cursor = "row-resize";
      e.preventDefault();
    });

    document.addEventListener("mousemove", (e) => {
      if (isResizingHorizontal) {
        const mainRect = document.getElementById("main").getBoundingClientRect();
        let newWidth = ((e.clientX - mainRect.left) / mainRect.width) * 100;
        newWidth = Math.max(25, Math.min(70, newWidth));
        document.documentElement.style.setProperty("--player-width", newWidth + "%");
      }
      if (isResizingVertical) {
        const playerRect = playerArea.getBoundingClientRect();
        let newHeightPx = e.clientY - playerRect.top;
        newHeightPx = Math.max(380, Math.min(window.innerHeight * 0.93, newHeightPx));
        const newHeightVh = (newHeightPx / window.innerHeight) * 100;
        document.documentElement.style.setProperty("--player-height", newHeightVh + "vh");
      }
    });

    document.addEventListener("mouseup", () => {
      if (isResizingHorizontal) {
        isResizingHorizontal = false;
        resizeBar.classList.remove("active");
        playerHorizontalHandle.style.background = "transparent";
        document.body.style.cursor = "default";
      }
      if (isResizingVertical) {
        isResizingVertical = false;
        verticalResizeBar.classList.remove("active");
        document.body.style.cursor = "default";
      }
    });
  }

  initResize();
  main();
</script>
</body>
</html>
